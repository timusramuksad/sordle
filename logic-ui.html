<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Logic UI</title>
    <style>
      :root {
        --bg: #121212;
        --panel: #1b1b1b;
        --text: #f5f5f5;
        --muted: #a5a5a5;
        --line: #2d2d2d;
        --green: #6aaa64;
        --yellow: #c9b458;
        --dark: #3a3a3c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(92vw, 420px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.5rem;
        text-align: center;
      }

      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }

      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #181818;
        color: var(--text);
        font-size: 1rem;
        text-transform: lowercase;
        letter-spacing: 0.12em;
      }

      button {
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: var(--green);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status-box {
        margin-top: 18px;
        min-height: 120px;
      }

      .attempt {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #141414;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 8px;
      }

      .guess {
        letter-spacing: 0.2em;
        font-weight: 700;
      }

      .result {
        letter-spacing: 0.2em;
        font-weight: 700;
      }

      .result .hit { color: var(--green); }
      .result .present { color: var(--yellow); }
      .result .miss { color: var(--muted); }

      .result .char-gray { color: var(--muted); }
      .result .char-yellow { color: var(--yellow); }
      .result .char-green { color: var(--green); }

      .message {
        margin-top: 8px;
        min-height: 22px;
        color: #ffd166;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Wordle Logic</h1>
      <div class="row">
        <input id="guessInput" type="text" maxlength="5" placeholder="Enter guess" />
        <button id="submitBtn" type="button">Submit</button>
      </div>
      <div id="statusBox" class="status-box"></div>
      <div id="message" class="message"></div>
    </div>

    <script>
      const target = 'saint';
      const maxGuesses = 5;
      const attempts = [];

      const guessInput = document.getElementById('guessInput');
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');
      const message = document.getElementById('message');

      function renderAttempts() {
        statusBox.innerHTML = attempts
          .map(({ guess, result }) => {
            const cells = result.map(({ char, type }) => {
              const cls = type === 'miss' ? 'char-gray' : type === 'present' ? 'char-yellow' : 'char-green';
              return `<span class="${cls}">${char}</span>`;
            }).join('');
            return `
              <div class="attempt">
                <span class="guess">${guess}</span>
                <span class="result">${cells}</span>
              </div>
            `;
          })
          .join('');
      }

      const wordValidationCache = new Map();

      async function isEnglishWord(word) {
        if (wordValidationCache.has(word)) {
          return wordValidationCache.get(word);
        }

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1500);

        try {
          const response = await fetch(
            `https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&max=10`,
            { signal: controller.signal }
          );
          if (!response.ok) return false;

          const entries = await response.json();
          const valid = entries.some((entry) => entry.word?.toLowerCase() === word);
          wordValidationCache.set(word, valid);
          return valid;
        } catch (error) {
          console.error('Dictionary request failed:', error);
          return false;
        } finally {
          clearTimeout(timeout);
        }
      }

      function scoreGuess(guess, targetWord) {
        const result = new Array(guess.length).fill('miss');
        const remaining = {};

        for (const letter of targetWord) {
          remaining[letter] = (remaining[letter] || 0) + 1;
        }

        for (let index = 0; index < guess.length; index += 1) {
          if (guess[index] === targetWord[index]) {
            result[index] = 'hit';
            remaining[guess[index]] -= 1;
          }
        }

        for (let index = 0; index < guess.length; index += 1) {
          if (result[index] === 'hit') continue;
          if (remaining[guess[index]] > 0) {
            result[index] = 'present';
            remaining[guess[index]] -= 1;
          }
        }

        return result.map((type, index) => ({ char: guess[index], type }));
      }

      async function submitGuess() {
        const guess = guessInput.value.trim().toLowerCase();
        if (!/^[a-z]{5}$/.test(guess)) {
          message.textContent = 'Enter a valid 5-letter word.';
          return;
        }

        submitBtn.disabled = true;
        message.textContent = 'Checking word...';

        const valid = await isEnglishWord(guess);
        submitBtn.disabled = false;

        if (!valid) {
          message.textContent = 'Not a valid English word.';
          return;
        }

        const result = scoreGuess(guess, target);
        attempts.push({ guess, result });
        renderAttempts();

        if (guess === target) {
          message.textContent = 'You won!';
          submitBtn.disabled = true;
          guessInput.disabled = true;
          guessInput.value = '';
          return;
        }

        if (attempts.length >= maxGuesses) {
          message.textContent = `Out of guesses! Target was: ${target.toUpperCase()}`;
          submitBtn.disabled = true;
          guessInput.disabled = true;
          guessInput.value = '';
          return;
        }

        guessInput.value = '';
        message.textContent = `Guess ${attempts.length}/${maxGuesses}`;
      }

      submitBtn.addEventListener('click', submitGuess);
      guessInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') submitGuess();
      });

      guessInput.focus();
      message.textContent = `Guess 1/${maxGuesses}`;
    </script>
  </body>
</html>
